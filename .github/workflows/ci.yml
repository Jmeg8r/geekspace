name: CI

# Runs the verify suite (typecheck + scheduler tests) on every PR and on main.
# Matrixed across ubuntu-latest and windows-latest; the job name is suffixed per-OS,
# so use "Typecheck & tests (ubuntu-latest)" and "Typecheck & tests (windows-latest)"
# as the required status checks in main's ruleset.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & tests (${{ matrix.os }})
    strategy:
      # Both OSes are required status checks with independently meaningful
      # results, so a failure on one shouldn't cancel the other's run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # verify only runs tsc + vitest — no need to download the Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      # Actions pinned to commit SHAs (supply-chain hardening); bumped by Dependabot.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck + tests)
        run: npm run verify
